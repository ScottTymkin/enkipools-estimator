<style>
:root{
  --enki-navy:#0f2748;
  --bg-deep:#0a1f33;
  --bg-mid:#0f2942;
  --panel:#15334f;
  --panel-line:rgba(255,255,255,0.08);
  --accent:#f5a623;
  --accent-soft:rgba(245,166,35,0.14);
  --text:#eaf1f8;
  --text-dim:#9bb3c9;
  --ok:#3ec28f;
  --guide:#9db8ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  background:
    radial-gradient(circle at 18% 12%, rgba(245,166,35,0.10), transparent 42%),
    radial-gradient(circle at 100% 100%, rgba(62,194,143,0.08), transparent 40%),
    linear-gradient(160deg,var(--bg-deep),var(--bg-mid));
  color:var(--text);min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
}

/* white logo band */
.brandbar{
  background:#fff;padding:calc(env(safe-area-inset-top) + 20px) 20px 20px;
  display:flex;justify-content:center;align-items:center;
  box-shadow:0 4px 24px rgba(0,0,0,0.25);position:sticky;top:0;z-index:10;
}
.brandbar img{height:84px;width:auto;display:block;max-width:88%;}

.wrap{flex:1;display:flex;flex-direction:column;
  padding:22px 20px calc(env(safe-area-inset-bottom) + 26px);}

/* header + back button */
.topline{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.back{
  display:none;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:12px;flex:0 0 40px;
  background:var(--panel);border:1px solid var(--panel-line);
  color:var(--text);font-size:22px;cursor:pointer;
}
.back:active{transform:scale(.93);border-color:var(--accent);}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);font-weight:700;}
.title{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.12;margin-top:4px;}
.subtitle{color:var(--text-dim);font-size:14.5px;margin-top:8px;line-height:1.45;margin-bottom:20px;}

/* tiles */
.grid{display:flex;flex-direction:column;gap:14px;}
.tile{
  display:flex;align-items:center;gap:16px;
  background:linear-gradient(150deg,var(--panel),rgba(21,51,79,0.6));
  border:1px solid var(--panel-line);border-radius:18px;padding:18px;
  text-decoration:none;color:var(--text);position:relative;overflow:hidden;
  transition:transform .15s ease,border-color .2s ease;
  cursor:pointer;animation:rise .5s ease both;
}
.tile:active{transform:scale(.975);border-color:var(--accent);}
.tile::after{content:"\203A";position:absolute;right:20px;top:50%;
  transform:translateY(-50%);font-size:26px;color:var(--text-dim);font-weight:600;}
.tile .ic{flex:0 0 52px;height:52px;border-radius:14px;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;font-size:24px;}
.tile .meta{display:flex;flex-direction:column;gap:3px;padding-right:24px;}
.tile .name{font-size:17px;font-weight:700;}
.tile .desc{font-size:13px;color:var(--text-dim);line-height:1.35;}
.kind{font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;font-weight:700;width:max-content;margin-top:5px;}
.kind.form{background:var(--accent-soft);color:var(--accent);}
.kind.sheet{background:rgba(62,194,143,0.16);color:var(--ok);}
.kind.guide{background:rgba(120,160,255,0.18);color:var(--guide);}
.kind.topic{background:rgba(255,255,255,0.10);color:var(--text-dim);}
.tile:nth-child(1){animation-delay:.05s}
.tile:nth-child(2){animation-delay:.12s}
.tile:nth-child(3){animation-delay:.19s}
.tile:nth-child(4){animation-delay:.26s}
.tile:nth-child(5){animation-delay:.33s}

/* section label inside a topic page */
.seclabel{font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-dim);font-weight:700;margin:22px 4px 12px;}
.seclabel:first-of-type{margin-top:6px;}

.footer{margin-top:auto;padding-top:26px;text-align:center;color:var(--text-dim);
  font-size:12px;line-height:1.5;}

#installHint{margin-top:22px;background:rgba(245,166,35,0.10);
  border:1px solid rgba(245,166,35,0.3);border-radius:14px;padding:14px 16px;
  font-size:13px;color:var(--text);line-height:1.55;}
#installHint b{color:var(--accent);}
@media (display-mode:standalone){#installHint{display:none;}}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page{display:none;}
.page.active{display:block;animation:fade .28s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

const content  = document.getElementById('content');
const titleEl   = document.getElementById('title');
const subEl     = document.getElementById('subtitle');
const eyebrowEl = document.getElementById('eyebrow');
const backBtn   = document.getElementById('backBtn');
const hint      = document.getElementById('installHint');

function tile(opts){
  const a=document.createElement(opts.url?'a':'div');
  a.className='tile';
  if(opts.url){a.href=opts.url;a.target='_blank';a.rel='noopener';}
  if(opts.onClick){a.addEventListener('click',opts.onClick);}
  a.innerHTML='<div class="ic">'+(opts.icon||"\ud83d\udd17")+'</div>'+
    '<div class="meta"><span class="name">'+opts.name+'</span>'+
    '<span class="desc">'+(opts.desc||"")+'</span>'+
    (opts.kind?'<span class="kind '+opts.kind+'">'+opts.kind+'</span>':'')+'</div>';
  return a;
}
function label(txt){const d=document.createElement('div');d.className='seclabel';d.textContent=txt;return d;}

function showHome(){
  content.innerHTML='';
  eyebrowEl.textContent='Team Hub';
  titleEl.textContent='Quick Access';
  subEl.textContent='Choose a topic to open its forms and instructions.';
  backBtn.style.display='none';
  hint.style.display='';
  const grid=document.createElement('div');grid.className='grid';
  TOPICS.forEach(t=>{
    if(t.directUrl && t.directUrl.trim()!=='' && t.directUrl.indexOf('PASTE')!==0){
      // topic is a straight link (e.g. a document folder) - open directly
      grid.appendChild(tile({
        name:t.name,desc:t.desc,icon:t.icon,kind:t.badge||'topic',url:t.directUrl
      }));
    } else {
      grid.appendChild(tile({
        name:t.name,desc:t.desc,icon:t.icon,kind:'topic',
        onClick:()=>showTopic(t.id)
      }));
    }
  });
  content.appendChild(grid);
  window.scrollTo(0,0);
}

function showTopic(id){
  const t=TOPICS.find(x=>x.id===id);if(!t)return;
  content.innerHTML='';
  eyebrowEl.textContent='Team Hub';
  titleEl.textContent=t.name;
  subEl.textContent=t.desc||'';
  backBtn.style.display='flex';
  hint.style.display='none';

  // forms (only if this topic has any)
  const validForms=t.forms.filter(f=>f.url && f.url.trim()!=='' && f.url.indexOf('PASTE')!==0);
  if(validForms.length){
    content.appendChild(label(validForms.length>1?'Forms':'Form'));
    const fg=document.createElement('div');fg.className='grid';
    validForms.forEach(f=>{
      fg.appendChild(tile({name:f.name,desc:f.desc,icon:"\ud83d\udcdd",kind:'form',url:f.url}));
    });
    content.appendChild(fg);
  }

  // instructions
  if(t.instructions && t.instructions.url && t.instructions.url.trim()!=='' && t.instructions.url.indexOf('PASTE')!==0){
    content.appendChild(label('Instructions'));
    const ig=document.createElement('div');ig.className='grid';
    ig.appendChild(tile({name:t.instructions.name,desc:t.instructions.desc,icon:"\ud83d\udcd6",kind:'guide',url:t.instructions.url}));
    content.appendChild(ig);
  }

  // documents / links (e.g. policies, folders)
  if(t.links && t.links.length){
    const valid=t.links.filter(l=>l.url && l.url.trim()!=='' && l.url.indexOf('PASTE')!==0);
    if(valid.length){
      content.appendChild(label(valid.length>1?'Documents':'Document'));
      const lg=document.createElement('div');lg.className='grid';
      valid.forEach(l=>{
        lg.appendChild(tile({name:l.name,desc:l.desc,icon:l.icon||"\ud83d\udcc4",kind:'guide',url:l.url}));
      });
      content.appendChild(lg);
    }
  }
  window.scrollTo(0,0);
}

backBtn.addEventListener('click',showHome);
showHome();
</script>
</body>
</html>
