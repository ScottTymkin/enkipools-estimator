// Access multiplier — applied to Swimming Pool base price
function accessMult(val) {
  switch (val) {
    case "1800":   return 1.15;   // < 1800mm Very Tight +15%
    case "2200":   return 1.05;   // 2000-2450mm Ok +5%
    case "2700":   return 1.00;   // 2500-2950mm Good +0%
    case "3000":   return 0.975;  // 3000mm+ Great -2.5%
    case "acreage": return 0.95;  // Acreage -5%
    default:       return 1.00;
  }
}

// Margin by client type
function getMargin(clientType) {
  if (clientType === "premium") return 0.20;
  if (clientType === "builder") return 0.25;
  return 0.15; // homeowner default
}

// ─── CALCULATION ENGINE ───────────────────────────────────────────────────────
function calculate(f) {
  const L = parseFloat(f.poolLength) || 0;
  const W = parseFloat(f.poolWidth) || 0;
  const dShallow = parseFloat(f.depthShallow) || 1.2;
  const dDeep = parseFloat(f.depthDeep) || 1.8;
  const avgDepth = (dShallow + dDeep) / 2;
  const sqm = L * W;
  const volumeL = sqm * avgDepth * 1000;
  const mult = accessMult(f.accessWidth);
  const margin = getMargin(f.clientType);

  const soilPenalty = f.soilClass === "H" ? 3000 : f.soilClass === "E" || f.soilClass === "P" ? 6500 : 0;
  const engSize = sqm < 20 ? "small" : sqm < 40 ? "medium" : sqm < 65 ? "large" : "complex";

  // ── 1. PRELIMINARY WORKS ──
  let prelim = 0;
  prelim += R.engineering[engSize] + R.engineering.hydraulics;
  prelim += sqm > 45 ? R.warrantyInsurance.large : R.warrantyInsurance.standard;
  prelim += sqm > 45 ? R.buildingPermit.large : R.buildingPermit.standard;
  prelim += R.draftingPlans;
  prelim += soilPenalty;

  // ── 2. EXCAVATION ──
  let excav = 0;
  const truckDays = parseInt(f.truckDays) || Math.max(2, Math.round(sqm * avgDepth * 0.6));
  const bobcatDays = parseInt(f.bobcatDays) || (f.accessWidth < 2500 ? 2 : 1);
  const tippingLoads = parseInt(f.tippingLoads) || Math.round(sqm * avgDepth * 1.5);
  excav += R.excavation.excavatorTruck * truckDays;
  excav += R.excavation.bobcat * bobcatDays;
  excav += R.excavation.tipping * tippingLoads;
  excav += R.excavation.float;
  if (parseInt(f.accessWidth) < 2500) excav += R.excavation.wheelbarrow;
  if (parseInt(f.accessWidth) >= 2500) excav += R.excavation.trackedLoader;
  if (f.trafficMgmt) excav += 3500;
  excav *= mult;

  // ── 3. CONCRETE SHELL ──
  let shell = 0;
  const barCount = Math.round(sqm * 5.5);
  shell += barCount * R.steel.perBar;
  shell += Math.max(R.steel.minSteelFix, barCount * R.steel.perBarFix);
  const concreteM3 = Math.round(sqm * avgDepth * 0.48);
  shell += concreteM3 * R.concrete.perM3;
  shell += R.pp1;
  const formworkSqm = Math.round(sqm * 0.5);
  const fwType = f.soilClass === "H" || f.soilClass === "E" || f.soilClass === "P" ? "heavyDuty" : f.extraFormwork ? "mediumDuty" : "lightDuty";
  shell += R.formwork[fwType] * formworkSqm;
  if (f.hasSpa) shell += f.spaType === "round" ? R.concrete.spa * 8 : R.concrete.spa * 6;
  if (f.infinityEdge) shell += R.concrete.infinityEdge + 9000;
  if (f.provisionalSum) shell += parseInt(f.provisionalSumAmt) || 0;
  shell *= mult;

  // ── 4. FILTRATION & EQUIPMENT ──
  let equip = 0;
  equip += R.equipment.pipeRun;
  equip += R.equipment.valves;
  equip += R.equipment.slabs;
  const filterCost = f.filterModel === "Tagelus100D" ? R.equipment.filterTagelus100D : R.equipment.filter25inch;
  equip += filterCost;
  equip += f.pumpModel === "intelliflo" ? R.equipment.intelliflo : f.pumpModel === "enviromax" ? R.equipment.enviromax : R.equipment.whisperflo15;
  const chlorCost = f.chlorinator === "SWC35" ? R.equipment.chlorinatorSWC35 : f.chlorinator === "SWC45" ? R.equipment.chlorinatorSWC45 : f.chlorinator === "intelliChlor" ? R.equipment.intelliChlor : R.equipment.chlorinatorSWC25;
  equip += chlorCost;
  if (f.hasAutomation) equip += f.automationType === "intelliCenter" ? R.equipment.intelliCenter : R.equipment.aquaLink + R.equipment.iAquaLink;
  const autofillerCost = f.autofillerType === "paralevel" ? R.equipment.paralevel : R.equipment.aquafill;
  equip += autofillerCost;

  // In-floor cleaning
  let infloorCost = 0;
  if (f.hasInFloor) {
    const stepNozzles = Math.max(4, Math.round(sqm * 0.15));
    const floorNozzles = Math.max(6, Math.round(sqm * 0.35));
    infloorCost = stepNozzles * R.inFloor.stepNozzle + floorNozzles * R.inFloor.floorNozzle + R.inFloor.port6valve + R.inFloor.whisperflo20;
    if (f.hasSpa) infloorCost += 2500;
    equip += infloorCost;
  }

  // Heat pump
  const hpCost = R.heatPumps[f.heatPump] || 0;
  if (hpCost) equip += hpCost;

  // Gas heater
  if (f.hasGasHeater) equip += R.gasHeater;

  // Solar
  let solarCost = 0;
  if (f.hasSolar) {
    const solarSqm = parseInt(f.solarSqm) || Math.round(sqm);
    solarCost = solarSqm * R.solar.perSqm + R.solar.pump + R.solar.filter + R.solar.controller + R.solar.internalPlumb;
    equip += solarCost;
  }

  // ── 5. INTERIOR (TILING) ──
  let interior = 0;
  // Calculate pool surface area (walls + floor)
  const perim = 2 * (L + W);
  const wallArea = perim * avgDepth;
  const floorArea = sqm;
  const totalTileArea = wallArea + floorArea;
  const tileCost = f.interior === "glass" ? R.tiles.glass : f.interior === "ceramic25mm" ? R.tiles.ceramic25mm : R.tiles.ceramic;
  const tilingRate = f.interior === "glass" ? R.tiling.glass : f.interior === "ceramic25mm" ? R.tiling.ceramic25mm : R.tiling.ceramic;
  interior += totalTileArea * (tileCost + tilingRate);
  if (f.hasSteps) interior += parseInt(f.stepCount || 3) * R.tiling.steps;
  if (f.hasSwimout) interior += R.tiling.swimout;
  if (f.hasSpa) interior += f.spaType === "round" ? R.tiling.roundSpa : R.tiling.spa;
  if (f.waterproofMembrane) interior += totalTileArea * R.waterproofing;

  // ── 6. LIGHTING ──
  let lighting = 0;
  const lightCount = parseInt(f.lightCount) || Math.max(2, Math.round(L / 3));
  lighting += lightCount * (R.lights.WN9 + R.lights.transformer + R.lights.cable30m);

  // ── 7. COMPLETION ──
  let completion = 0;
  completion += 800;    // fitout / commission labour
  completion += 800;    // rubbish
  completion += 375;    // pool chemicals

  // ── LABOUR ──
  const labourHrs = Math.round(sqm * 8.5 + (f.hasSpa ? 40 : 0) + (f.hasInFloor ? 25 : 0));
  const labourCost = labourHrs * R.labour.rate;
  const overheadCost = labourHrs * R.labour.overhead;

  const subtotal = prelim + excav + shell + equip + interior + lighting + completion + labourCost + overheadCost;
  const profit = subtotal * margin;
  const exGST = subtotal + profit;
  const gst = exGST * 0.10;
  const total = exGST + gst;

  // Line items for the proposal quotation table
  const poolBasePrice = shell + excav + prelim + labourCost + overheadCost + completion + R.equipment.pipeRun + R.equipment.valves + R.equipment.slabs + filterCost + (f.pumpModel === "intelliflo" ? R.equipment.intelliflo : f.pumpModel === "enviromax" ? R.equipment.enviromax : R.equipment.whisperflo15) + autofillerCost;
  const poolBasePriceWithMargin = poolBasePrice * (1 + margin) * 1.10;

  return {
    sqm: sqm.toFixed(1),
    volumeL: Math.round(volumeL),
    engineeringSize: engSize,
    truckDays, bobcatDays, tippingLoads, labourHrs,
    sections: {
      preliminary: Math.round(prelim),
      excavation: Math.round(excav),
      shell: Math.round(shell),
      equipment: Math.round(equip),
      interior: Math.round(interior),
      lighting: Math.round(lighting),
      completion: Math.round(completion),
      labour: Math.round(labourCost),
      overhead: Math.round(overheadCost),
    },
    subtotal: Math.round(subtotal),
    profit: Math.round(profit),
    marginPct: (margin * 100).toFixed(0),
    exGST: Math.round(exGST),
    gst: Math.round(gst),
    total: Math.round(total),
  }
}

    }[form.chlorinator] || "Pool Controls SWC35 with Auto pH";
    const chlorPrice = PP.chlorinator[form.chlorinator] || PP.chlorinator.SWC35;

    const autofillerPrice = form.autofillerType === "paralevel" ? PP.paralevel : PP.aquafill;
    const autofillerLabel = form.autofillerType === "paralevel" ? "Paramount Paralevel" : "AquaFill";

    const automationRequired = form.hasAutomation || form.hasSpa;
    const automationPrice = automationRequired
      ? (form.automationType === "intelliCenter" ? PP.automation.intelliCenter : PP.automation.aquaLink)

    const automationLabel = form.automationType === "intelliCenter"
      ? "Pentair IntelliCentre PNP8 + Phone Control"

    const gasPrice = gasRequired ? PP.gasHeater : 0;

    const hpExact = form.heatPump !== "None" ? PP.heatPumps[form.heatPump] : 0;
    const hpBasePrice = form.heatPump !== "None"
      ? (hpExact !== null && hpExact !== undefined ? hpExact : (R.heatPumps[form.heatPump] || 0))

    const hpWallMountCost = form.heatPump !== "None" && form.heatPumpWallMount ? parseFloat(form.heatPumpWallMountCost) || 0 : 0;

    const hpIsExact = form.heatPump !== "None" && hpExact !== null && hpExact !== undefined;

    // Swimming Pool base price = $2,750/sqm (incl. 15% margin) ± interior adjustments ± margin uplift
    // Pool area — circle (π × r²) if Round, otherwise L × W
    const poolDiam = parseFloat(form.poolDiameter) || parseFloat(form.poolLength || 8);
    const sqmNum = form.poolShape === "Round"
      ? Math.PI * Math.pow(poolDiam / 2, 2)
      : parseFloat(form.poolLength || 8) * parseFloat(form.poolWidth || 4);
    const aquaNeonDiscount = form.interior === "aquaneon" ? Math.round(sqmNum * PP.poolVariables.aquaNeonDiscount) : 0;
    const avgDepth = (parseFloat(form.depthShallow || 1.2) + parseFloat(form.depthDeep || 1.8)) / 2 + 0.1;
    const perim = form.poolShape === "Round"
      ? Math.PI * poolDiam
      : 2 * (parseFloat(form.poolLength || 8) + parseFloat(form.poolWidth || 4));
    const totalTiledArea = sqmNum + (perim * avgDepth);
    const tile25mmSurcharge = form.interior === "ceramic25mm" ? Math.round(totalTiledArea * PP.poolVariables.tile25mmSurcharge) : 0;
    // Swimout cost — $1,000/sqm added to pool base

    // Pump upgrade cost — added to pool base

    // Filter discount — Pentair 25in reduces pool base by $480
    const filterDiscount = form.filterModel === "25inch" ? PP.poolVariables.filterDiscount25inch : 0;

    // Tile Supply P.C. Rate — base $55/sqm included in pool price; excess above $55 × tile area with waste
    const tilePCRateVal = parseFloat(form.tilePCRate) || 55;
    const tileAreaWithWaste = totalTiledArea * 1.08;
    const tilePCSurcharge = tilePCRateVal > 55 ? Math.round(tileAreaWithWaste * (tilePCRateVal - 55)) : 0;

    // Soil not removed — credit 8 included loads x $300
    const soilNotRemovedCredit = form.soilRemoved === "no" ? -(8 * 300) : 0;
    // Soil class — H adds $3,000, E adds $6,500 to pool base

    // Full width steps — $750/m of pool width added to pool, $500/m to in-floor
    const poolWidth = parseFloat(form.poolWidth || 4);
    const fullWidthStepsCostPool = form.hasSteps && form.stepType === "fullwidth" ? Math.round(poolWidth * 750) : 0;
    const fullWidthStepsCostInFloor = form.hasInFloor && form.hasSteps && form.stepType === "fullwidth" ? Math.round(poolWidth * 500) : 0;
    const halfWidthStepsCostPool = form.hasSteps && form.stepType === "halfwidth" ? Math.round(poolWidth * 375) : 0;
    const halfWidthStepsCostInFloor = form.hasInFloor && form.hasSteps && form.stepType === "halfwidth" ? Math.round(poolWidth * 375) : 0;
    // Formwork — declare before baseBeforeUplift as topBond is included in pool base
    const formworkQty = form.hasFormwork ? parseFloat(form.formworkSqm) || 0 : 0;
    const formworkRates = { topBond: 65, lightDuty: 120, mediumDuty: 145, heavyDuty: 200 };
    const formworkRate = formworkRates[form.formworkType] || 0;
    const formworkRawCost = Math.round(formworkQty * formworkRate);
    const formworkIsIncluded = true; // all formwork now included in pool base
    const formworkCost = 0; // no separate line — always in pool base

    // Pipe run cost — declared here as it feeds into pool base

    const pipeRunOverage = Math.max(0, pipeRunMeters - 10);

    // Margin uplift: base already includes 15%; premium adds 5%, builder adds 10%
    const marginUpliftPct = form.clientType === "premium" ? 0.05 : form.clientType === "builder" ? 0.10 : 0;

    // Pool shape multiplier — Freeform +10%, Round +8%

    const baseBeforeUplift = Math.round((Math.round(sqmNum * PP.poolPerSqm) - aquaNeonDiscount + tile25mmSurcharge + swimoutCost + fullWidthStepsCostPool + halfWidthStepsCostPool + soilNotRemovedCredit + soilClassCost + trafficMgmtCost + formworkPoolAddition + tilePCSurcharge + pumpUpgradeCost + pipeRunCost - filterDiscount + truckAdjustment + externalSurfacesCost + membraneAreaOnlyCost + drivewayPoolCost + roadClosureCost + beamCost
      - (form.engineeringPlans === "byOthers" ? PP.poolVariables.engineeringByOthersCredit : 0)) * accessMultiplier * shapeMultiplier * locationMultiplier);
    const poolBase = Math.round(baseBeforeUplift * (1 + marginUpliftPct));

    // Tipping: 8 loads included. Each load above 8 = $300

    const foundationsCost = parseFloat(form.foundationsPS) || 0;
    const soilLoads = parseFloat(form.soilLoadsOnSite) || 0;

    const interiorLabel = form.interior === "glass" ? "Glass Mosaic Tile"

    const fwLabel = { topBond: "Top Bond/Plinth", lightDuty: "Light Duty", mediumDuty: "Medium Duty", heavyDuty: "Heavy Duty" }[form.formworkType] || "";
    const poolSubLabel = interiorLabel

      + (swimoutCost > 0 ? " — incl. Swimout " + swimoutSqm.toFixed(2) + " Sq.m ($" + swimoutCost.toLocaleString("en-AU") + ")" : "")
      + (beamCost > 0 ? " — Beams " + form.beamLength + "m x " + form.beamWidth + "mm (+$" + beamCost.toLocaleString("en-AU") + ")" : "")
      + (fullWidthStepsCostPool > 0 ? " — incl. Full Width Steps ($" + fullWidthStepsCostPool.toLocaleString("en-AU") + ")" : "")
      + (halfWidthStepsCostPool > 0 ? " — incl. Half Width Steps ($" + halfWidthStepsCostPool.toLocaleString("en-AU") + ")" : "")
      + (form.engineeringPlans === "byOthers" ? " — Engineering by Others (-$1,500)" : "")
      + (soilNotRemovedCredit < 0 ? " — Soil on Site (-$2,400)" : "")
      + (soilClassCost > 0 ? " — Soil Class " + form.soilClass + " (+$" + soilClassCost.toLocaleString("en-AU") + ")" : "")
      + (shapeMultiplier > 1 ? " — " + form.poolShape + " shape (+" + ((shapeMultiplier - 1) * 100).toFixed(0) + "%)" : "")
      + (trafficMgmtCost > 0 ? " — Traffic Management (+$" + trafficMgmtCost.toLocaleString("en-AU") + ")" : "")
      + (tilePCSurcharge > 0 ? " — Tile P.C. upgrade (+$" + tilePCSurcharge.toLocaleString("en-AU") + ")" : "")
      + (filterDiscount > 0 ? " — Pentair 25in filter (-$" + filterDiscount.toLocaleString("en-AU") + ")" : "")
      + (pumpUpgradeCost > 0 ? " — " + (form.pumpModel === "intelliflo" ? "Intelliflo VS" : "EnviroMax VS") + " upgrade (+$" + pumpUpgradeCost.toLocaleString("en-AU") + ")" : "")
      + (truckAdjustment !== 0 ? " — " + truckQty + " truck" + (truckQty !== 1 ? "s" : "") + " (" + (truckAdjustment > 0 ? "+" : "") + "$" + truckAdjustment.toLocaleString("en-AU") + ")" : "")
      + (roadClosureCost > 0 ? " — Road Closure " + (form.roadClosureType === "full" ? "Full Day" : "1/2 Day") + " x" + roadClosureQtyNum + " (+$" + roadClosureCost.toLocaleString("en-AU") + ")" : "")
      + (drivewayPoolCost > 0 ? " — Driveway Protection " + form.drivewayProtectionSize + "m (+$" + drivewayPoolCost.toLocaleString("en-AU") + ")" : "")
      + (membraneAreaOnlyCost > 0 ? " — Membrane Area " + form.membraneAreaOnly + " Sq.m (+$" + membraneAreaOnlyCost.toLocaleString("en-AU") + ")" : "")

    const lines = [
      form.sitePrepDemolition && parseFloat(form.sitePrepDemolitionCost) > 0 && { label: "Site Prep or Demolition", sub: "As quoted", value: parseFloat(form.sitePrepDemolitionCost) },

      trackedLoaderCost > 0 && { label: "Tracked Loader (Posi or Wheeled Dumper)", sub: `${form.trackedLoaderDays} day${parseFloat(form.trackedLoaderDays) !== 1 ? "s" : ""} @ $1,650/day`, value: trackedLoaderCost },
      extraTippingCost > 0 && { label: "Additional Tipping", sub: `${tippingQty - 8} loads above included 8 @ $300/load`, value: extraTippingCost },
      soilCredit < 0 && { label: "Soil Left on Site", sub: `${soilLoads} load${soilLoads !== 1 ? "s" : ""} remaining on site — credit`, value: soilCredit, credit: true },
      form.roadClosure && roadClosureCost > 0 && { label: "Road Closure", sub: (form.roadClosureType === "full" ? "Full Day" : "1/2 Day") + " x " + roadClosureQtyNum + " = $" + roadClosureCost.toLocaleString("en-AU") + " — incl. in Swimming Pool price", value: 0, hideZero: true },
      form.infinityEdge && { label: "Infinity Edge & Balance Tank", sub: (() => {
        const ieDetail = { reverseEdge: "Reverse Edge (Towards pool)", forwardEdge: "Forward Edge (Away from pool)", curvedEdge: "Curved Edge (Curved away from pool)" }[form.infinityEdgeDetail] || "";
        const ieLen = parseFloat(form.infinityEdgeLength || form.poolLength) || 0;
        const btL = parseFloat(form.balanceTankLength || form.poolLength) || 0;
        const btW = parseFloat(form.balanceTankWidth || "0.8") || 0.8;
        const btD = parseFloat(form.balanceTankDepth || "0.8") || 0.8;
        const wallH = parseFloat(form.infinityEdgeWallHeight || "1.2") || 1.2;
        const wallSteps = Math.round((wallH - 1.2) / 0.1);
        const wallMultiplier = wallSteps > 0 ? Math.pow(1.05, wallSteps) : 1;
        const baseIERate = Math.round(4500 * wallMultiplier);
        const curvedSurcharge = form.infinityEdgeDetail === "curvedEdge" ? Math.round(ieLen * 250) : 0;
        const btSqm = (btL * btW) + (2 * btL * btD) + (2 * btW * btD);
        const tiledSurcharge = form.infinityEdgeInteriorFinish === "tiled" ? Math.round(btSqm * 250) : 0;
        const shapeIsRound = form.poolShape === "Freeform" || form.poolShape === "Round";
        const subtotal = Math.round(ieLen * 4500 * wallMultiplier) + curvedSurcharge + tiledSurcharge;
        const shapeSurcharge = shapeIsRound ? Math.round(subtotal * 0.10) : 0;
        const line1 = form.infinityEdgeInteriorFinish === "tiled" ? "Tiled" : "Grating";
        return [line1];
      })(), value: (() => {

        const btL = parseFloat(form.balanceTankLength || form.poolLength) || 0;
        const btW = parseFloat(form.balanceTankWidth || "0.8") || 0.8;
        const btD = parseFloat(form.balanceTankDepth || "0.8") || 0.8;
        const wallH = parseFloat(form.infinityEdgeWallHeight || "1.2") || 1.2;
        const wallSteps = Math.round((wallH - 1.2) / 0.1);
        const wallMultiplier = wallSteps > 0 ? Math.pow(1.05, wallSteps) : 1;
        const curvedSurcharge = form.infinityEdgeDetail === "curvedEdge" ? Math.round(ieLen * 250) : 0;
        const btSqm = (btL * btW) + (2 * btL * btD) + (2 * btW * btD);
        const tiledSurcharge = form.infinityEdgeInteriorFinish === "tiled" ? Math.round(btSqm * 250) : 0;
        const subtotal = Math.round(ieLen * 4500 * wallMultiplier) + curvedSurcharge + tiledSurcharge;
        const shapeSurcharge = (form.poolShape === "Freeform" || form.poolShape === "Round") ? Math.round(subtotal * 0.10) : 0;
        return subtotal + shapeSurcharge;
      })() },
      form.hasSpa && { label: "Spa", sub: {
        square18: "Square Spa 1.8 x 1.8m",
        square22: "Square Spa 2.2 x 2.2m",
        squareGutter: "Square Spa with Gutter",
        squareRaised: "Square Spa & Raised 300mm",
        round20: "Round Spa 2.0m",
        round25: "Round Spa 2.5m",
        roundGutter: "Round Spa with Gutter",
        roundGutterRaised: "Round Spa with Gutter & Raised 300mm",
      }[form.spaType] || "Spa", value: spaPrice },
      form.hasInFloor && { label: "In Floor Cleaning & Circulation System", sub: "Paramount PCC2000 with MDX" + (fullWidthStepsCostInFloor > 0 ? " — incl. Full Width Steps ($" + fullWidthStepsCostInFloor.toLocaleString("en-AU") + ")" : "") + (halfWidthStepsCostInFloor > 0 ? " — incl. Half Width Steps ($" + halfWidthStepsCostInFloor.toLocaleString("en-AU") + ")" : ""), value: inFloorPrice },
      form.hasSolar && { label: `Solar Heating — ${solarSqmCount} Sq.m`, sub: form.solarLocation || "On House Roof", value: solarPrice },
      { label: "LED Lighting (Including Cabling to Equip Area)", sub: totalLights + " x " + lightLabel + (spaLightBonus > 0 ? " (incl. 1 x Spa)" : ""), value: lightingPrice },
      { label: "Salt Chlorinator", sub: chlorLabel, value: chlorPrice },
      { label: "Water Refill Regulator", sub: autofillerLabel, value: autofillerPrice },
      automationRequired && { label: "Pool & Spa Automation", sub: automationLabel, value: automationPrice },
      gasRequired && { label: "Gas Heater", sub: "Pentair Master Temp 400 Mj", value: gasPrice },
      form.heatPump !== "None" && { label: "Heat Pump", sub: form.heatPump + (!hpIsExact ? " (est.)" : "") + (hpWallMountCost > 0 ? " — incl. Wall Mounting ($" + hpWallMountCost.toLocaleString("en-AU") + ")" : ""), value: hpPrice, tbc: !hpIsExact },
      parseFloat(form.rockHardGround) > 0 && { label: "Rock or Hard Ground", sub: "PROVISIONAL SUM", value: parseFloat(form.rockHardGround) },
      form.drivewayProtection && { label: "Driveway Protection", sub: (() => { const sizes = {"10":"10m","15":"15m","20":"20m","25":"25m","30":"30m","40":"40m"}; return (sizes[form.drivewayProtectionSize] || "10m") + " @ 2400mm — incl. in Swimming Pool price"; })(), value: 0, hideZero: true },
      form.hasSpa && form.hasAirBlower && { label: "Air Blower", sub: "Spa Air Blower", value: PP.airBlower },
      { label: "Shoring, Underground Formwork & Foundations", sub: ({ underPoolPiers: "Under Pool Piers", shallowProppedPiers: "Shallow Propped Piers", protectionPiers: "Protection Piers" }[form.foundationsType] || "") + " — PROVISIONAL SUM", value: foundationsCost > 0 ? foundationsCost : 0 },
      { label: "Aftercare Service (2 x Initial Monthly Services)", sub: "NO CHARGE", value: 0 },
    ].filter(Boolean);

    const exGSTTotal = lines.reduce((s, l) => s + (l.value || 0), 0);
    const gst = Math.round(exGSTTotal * 0.10);
    const incGSTTotal = exGSTTotal + gst;
    const hasTBC = lines.some(l => l.tbc && l.value > 0);

    const fmtEx = (n) => `$${n.toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

    return (

          <div style={{ fontSize: 13, color: "#000" }}>{form.clientAddress}, {form.clientSuburb}</div>

        {hasTBC && (

        <div style={{ marginBottom: 8 }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr auto", padding: "9px 14px", background: "#0d2d6b", color: "white", borderRadius: "8px 8px 0 0", fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>

          </div>
          {lines.map((l, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 8, padding: "10px 14px", background: l.credit ? "#f0fff4" : i % 2 === 0 ? "white" : "#fafbff", borderLeft: `3px solid ${l.credit ? "#27ae60" : "transparent"}`, borderRight: "1px solid #e8eef8", borderBottom: "1px solid #e8eef8" }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500, color: "#000" }}>{l.label}{l.tbc && l.value > 0 ? " *" : ""}</div>
                <div style={{ fontSize: 11, color: l.credit ? "#27ae60" : "#000", marginTop: 2 }}>{Array.isArray(l.sub) ? l.sub.map((s, j) => <div key={j}>{s}</div>) : l.sub}</div>
              </div>
              <div style={{ fontSize: 13, fontWeight: 600, color: l.credit ? "#27ae60" : "#000", whiteSpace: "nowrap", alignSelf: "center" }}>
                {l.tbc ? <span style={{ color: "#e05c3a", fontSize: 12 }}>PRICE ON REQUEST</span>
                  : l.credit
                  ? `−$${Math.abs(l.value).toLocaleString("en-AU", { minimumFractionDigits: 2 })}`
                  : `$${l.value.toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`}
              </div>
            </div>
          ))}
          <div style={{ background: "#f0f4fb", padding: "12px 14px", borderRadius: "0 0 8px 8px", border: "1px solid #e8eef8" }}>
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 32, fontSize: 13, color: "#000", marginBottom: 6 }}>
              <span>GST (10%)</span>
              <span style={{ fontWeight: 600 }}>{fmtEx(gst)}</span>
            </div>

              return subtotal + shapeSurcharge;
            })();
            const exGSTTotal = poolBase + membraneCost + extraBobcat + trackedLoaderAmt + extraTipping + soilCredit + foundationsAmt + spaAmt + airBlowerAmt + inFloorAmt + solarAmt + lightingAmt + chlorAmt + autofillerAmt + automationAmt + gasAmt + hpAmt + rockAmt + sitePrepAmt + infinityEdgeAmt;

            // Cost = poolBase / (1 + marginUpliftPct) / 1.15 — then profit = sellPrice - cost
            const baseMargin = 0.15; // always baked into $2,750/sqm

              </div>

            return (
              <div>
                <SumSection title="Client & Project">

                  <SumRow label="Address" value={`${form.clientAddress}, ${form.clientSuburb}`} />
                  <SumRow label="Client Type" value={{ homeowner: "Homeowner", builder: "Builder", premium: "Premium" }[form.clientType]} />
                </SumSection>

                <SumSection title="Pool">
                  <SumRow label="Dimensions" value={form.poolShape === "Round" && form.poolDiameter ? form.poolDiameter + "m diameter (" + sqm.toFixed(1) + " Sq.m)" : L + "m x " + W + "m (" + sqm.toFixed(1) + " Sq.m)"} />
                  <SumRow label="Depth" value={`Shallow ${dShallow}m — Deep ${dDeep}m (avg ${((dShallow + dDeep) / 2).toFixed(2)}m)`} />
                  <SumRow label="Shape" value={`${form.poolShape}${form.poolShape === "Freeform" ? " (+10%)" : form.poolShape === "Round" ? " (+8%)" : ""}`} />
                  <SumRow label="Volume (approx)" value={`${Math.round(sqm * ((dShallow + dDeep) / 2) * 1000).toLocaleString("en-AU")} L`} />
                  <SumRow label="Entry Steps" value={form.hasSteps ? `${form.stepCount} × ${form.stepType === "fullwidth" ? "Full Width Steps" : form.stepType === "halfwidth" ? "Half Width Steps" : "Corner Steps"}` : "None"} />
                  {form.hasSwimout && <SumRow label="Swimout / Ledge" value={`${form.swimoutLength}m × ${form.swimoutWidth}m (${(parseFloat(form.swimoutLength) * parseFloat(form.swimoutWidth)).toFixed(2)} Sq.m)`} />}
                  {form.hasBeams && beamCostS > 0 && <SumRow label="Beams" value={form.beamLength + "m x " + form.beamWidth + "mm = " + beamSqmS.toFixed(2) + " Sq.m @ $800 = $" + beamCostS.toLocaleString("en-AU") + " (incl. in pool price)"} />}
                  <SumRow label="Pipe Run" value={(form.pipeRunDistance || 10) + "m total" + (pipeCost > 0 ? " - " + pipeOverage + "m over 10m x $450 = $" + pipeCost.toLocaleString("en-AU") + " (incl. in pool)" : " (within included 10m)")} />
                </SumSection>

                {form.hasSpa && <SumSection title="Spa">

                  <SumRow label="Air Blower" value={form.hasAirBlower ? `Included — $${PP.airBlower.toLocaleString("en-AU")}` : "Not included"} />
                  {form.hasAutomation && <SumRow label="Automation" value={form.automationType === "intelliCenter" ? "Pentair IntelliCentre PNP8 + Phone Control" : "AquaLink PS8 PDA + iAquaLink Phone Control"} />}
                </SumSection>}

                {form.infinityEdge && <SumSection title="Infinity Edge & Balance Tank">
                  <SumRow label="Edge Detail" value={{ reverseEdge: "Reverse Edge (Towards pool)", forwardEdge: "Forward Edge (Away from pool)", curvedEdge: "Curved Edge (Curved away from pool)" }[form.infinityEdgeDetail] || "Included"} />

                  <SumRow label="Wall Height (Above Balance Tank)" value={(form.infinityEdgeWallHeight || "1.2") + "m"} />
                  <SumRow label="Interior Finish" value={(() => {
                    const btL = parseFloat(form.balanceTankLength || form.poolLength) || 0;

                    const btD = parseFloat(form.balanceTankDepth || "0.8") || 0.8;
                    const btSqm = (btL * btW) + (2 * btL * btD) + (2 * btW * btD);
                    const tiledSurcharge = form.infinityEdgeInteriorFinish === "tiled" ? Math.round(btSqm * 250) : 0;
                    return form.infinityEdgeInteriorFinish === "tiled" ? "Tiled — " + btSqm.toFixed(1) + " Sq.m x $250 = +$" + tiledSurcharge.toLocaleString("en-AU") : "Grating (no surcharge)";
                  })()} />
                  <SumRow label="Balance Tank" value={(form.balanceTankLength || form.poolLength || "?") + "m L x " + (form.balanceTankWidth || "0.8") + "m W x " + (form.balanceTankDepth || "0.8") + "m D"} />
                  {(() => {
                    const ieLen = parseFloat(form.infinityEdgeLength || form.poolLength) || 0;
                    const wallH = parseFloat(form.infinityEdgeWallHeight || "1.2") || 1.2;
                    const wallSteps = Math.round((wallH - 1.2) / 0.1);
                    const wallMultiplier = wallSteps > 0 ? Math.pow(1.05, wallSteps) : 1;
                    const adjRate = Math.round(4500 * wallMultiplier);
                    const curvedSurcharge = form.infinityEdgeDetail === "curvedEdge" ? Math.round(ieLen * 250) : 0;
                    const btL = parseFloat(form.balanceTankLength || form.poolLength) || 0;
                    const btW = parseFloat(form.balanceTankWidth || "0.8") || 0.8;
                    const btD = parseFloat(form.balanceTankDepth || "0.8") || 0.8;
                    const btSqm = (btL * btW) + (2 * btL * btD) + (2 * btW * btD);

                    const subtotal = Math.round(ieLen * adjRate) + curvedSurcharge + tiledSurcharge;
                    const shapeSurcharge = (form.poolShape === "Freeform" || form.poolShape === "Round") ? Math.round(subtotal * 0.10) : 0;
                    return <SumRow label="Total Price" value={"$" + adjRate.toLocaleString("en-AU") + "/m" + (wallSteps > 0 ? " +" + wallSteps + "x5% wall height" : "") + (curvedSurcharge > 0 ? " +$" + curvedSurcharge.toLocaleString("en-AU") + " curved" : "") + (tiledSurcharge > 0 ? " +$" + tiledSurcharge.toLocaleString("en-AU") + " tiled" : "") + (shapeSurcharge > 0 ? " +" + form.poolShape + " 10% = +$" + shapeSurcharge.toLocaleString("en-AU") : "") + " = $" + (subtotal + shapeSurcharge).toLocaleString("en-AU")} />;

                  {form.sitePrepDemolition && parseFloat(form.sitePrepDemolitionCost) > 0 && <SumRow label="Site Prep or Demolition" value={`$${parseFloat(form.sitePrepDemolitionCost).toLocaleString("en-AU", { minimumFractionDigits: 2 })}`} />}

                  {form.soilRemoved === "yes" && <SumRow label="Trucks" value={truckQtyS + " truck" + (truckQtyS !== 1 ? "s" : "") + (truckAdjS < 0 ? " (−$" + Math.abs(truckAdjS).toLocaleString("en-AU") + " incl. in pool price)" : truckAdjS > 0 ? " (+$" + truckAdjS.toLocaleString("en-AU") + " incl. in pool price)" : " (included)")} credit={truckAdjS < 0} />}

                  {form.soilOnSite && parseFloat(form.soilLoadsOnSite) > 0 && <SumRow label="Soil Left on Site" value={`${form.soilLoadsOnSite} loads — credit −$${(parseFloat(form.soilLoadsOnSite) * 180).toLocaleString("en-AU")}`} credit />}
                  {parseFloat(form.rockHardGround) > 0 && <SumRow label="Rock or Hard Ground" value={`PS $${parseFloat(form.rockHardGround).toLocaleString("en-AU")}`} />}
                  {form.roadClosure && roadAmt > 0 && <SumRow label="Road Closure" value={(form.roadClosureType === "full" ? "Full Day" : "1/2 Day") + " x " + roadClosureQtyS + " @ $" + roadClosureRateS.toLocaleString("en-AU") + " = $" + roadAmt.toLocaleString("en-AU") + " (incl. in pool price)"} />}
                  {form.drivewayProtection && <SumRow label="Driveway Protection" value={form.drivewayProtectionSize + "m @ 2400mm — $" + ({"10":950,"15":1100,"20":1200,"25":1300,"30":1500,"40":1800}[form.drivewayProtectionSize] || 950).toLocaleString("en-AU") + " (incl. in pool price)"} />}
                  {form.trafficMgmt && trafficMgmtCostS > 0 && <SumRow label="Traffic Management" value={`$${trafficMgmtCostS.toLocaleString("en-AU")} (incl. in pool price)`} />}
                </SumSection>

                <SumSection title="Pool Price Variables">
                  <SumRow label={"Base (" + sqm.toFixed(1) + " Sq.m x $2,750" + (marginUpliftPct > 0 ? " +" + (marginUpliftPct * 100) + "% client" : "") + (locationMultiplierS > 1 ? " +" + ((locationMultiplierS-1)*100).toFixed(0) + "% location" : "") + ")"} value={fmtS(poolBase)} />
                  {aquaNeonDisc > 0 && <SumRow label="AquaNeon Discount" value={`−$${Math.round(aquaNeonDisc).toLocaleString("en-AU")}`} credit />}
                  {swimoutCostS > 0 && <SumRow label={`Swimout (${swimoutSqmS.toFixed(2)} Sq.m @ $1,000/Sq.m)`} value={fmtS(swimoutCostS)} />}
                  {form.engineeringPlans === "byOthers" && <SumRow label="Engineering by Others" value="−$1,500" credit />}
                  {fullWidthStepsPool > 0 && <SumRow label={`Full Width Steps — Pool (${poolWidthS}m × $750)`} value={fmtS(fullWidthStepsPool)} />}
                  {fullWidthStepsInFloor > 0 && <SumRow label={`Full Width Steps — In-Floor (${poolWidthS}m × $500)`} value={fmtS(fullWidthStepsInFloor)} />}
                  {halfWidthStepsPool > 0 && <SumRow label={`Half Width Steps — Pool (${poolWidthS}m × $375)`} value={fmtS(halfWidthStepsPool)} />}
                  {halfWidthStepsInFloor > 0 && <SumRow label={`Half Width Steps — In-Floor (${poolWidthS}m × $375)`} value={fmtS(halfWidthStepsInFloor)} />}
                  {tile25Surcharge > 0 && <SumRow label={"25mm Tile Surcharge (" + totalTiledArea.toFixed(1) + " Sq.m)"} value={`+$${Math.round(tile25Surcharge).toLocaleString("en-AU")}`} />}
                  {form.hasFormwork && formworkQtyS > 0 && (() => { const fwL = { topBond: "Top Bond/Plinth", lightDuty: "Light Duty", mediumDuty: "Medium Duty", heavyDuty: "Heavy Duty" }[form.formworkType]; const fwVal = (form.formworkType === "topBond" ? formworkQtyS + "lm" : formworkQtyS + " Sq.m") + " @ $" + formworkRateS + "/unit = $" + formworkRawS.toLocaleString("en-AU") + " (incl. in pool)"; return <SumRow label={"Formwork - " + fwL} value={fwVal} />; })()}
                  {membraneCost > 0 && <SumRow label="Waterproof Membrane" value={fmtS(membraneCost)} />}
                  {membraneAreaOnlyCostS > 0 && <SumRow label={"Waterproof Membrane — Area Only" + (form.membraneAreaOnlyType ? " (" + form.membraneAreaOnlyType + ")" : "")} value={form.membraneAreaOnly + " Sq.m @ $90 = $" + membraneAreaOnlyCostS.toLocaleString("en-AU") + " (incl. in pool price)"} />}
                  {soilCredit < 0 && <SumRow label={"Soil on Site (" + soilLoads + " loads)"} value={"−$" + Math.abs(soilCredit).toLocaleString("en-AU")} credit />}
                  {foundationsAmt > 0 && <SumRow label="Foundations / Shoring PS" value={({ underPoolPiers: "Under Pool Piers", shallowProppedPiers: "Shallow Propped Piers", protectionPiers: "Protection Piers" }[form.foundationsType] || "") + " — $" + foundationsAmt.toLocaleString("en-AU")} />}
                  {pipeCost > 0 && <SumRow label={"Pipe Run (" + pipeOverage + "m over 10m @ $450/m)"} value={"$" + pipeCost.toLocaleString("en-AU") + " (incl. in pool price)"} />}
                  {pumpUpgradeCostS > 0 && (() => { const pl = {intelliflo: "Intelliflo VS", enviromax: "EnviroMax VS"}[form.pumpModel]; return <SumRow label={pl + " Pump Upgrade"} value={"+" + "$" + pumpUpgradeCostS.toLocaleString("en-AU") + " (incl. in pool price)"} />; })()}
                </SumSection>

                <SumSection title="Interior">
                  {(() => {
                    const iLabel = { ceramic: "Ceramic Tile 50x50mm", ceramic25mm: "Ceramic Tile 25x25mm", glass: "Glass Mosaic Tile", aquaneon: "AquaNeon Interior" }[form.interior];
                    const tileAreaWithWaste = totalTiledArea * 1.08;
                    const tilePCRateVal = parseFloat(form.tilePCRate) || 55;
                    const tilePCSurchargeS = tilePCRateVal > 55 ? Math.round(tileAreaWithWaste * (tilePCRateVal - 55)) : 0;
                    return <>
                      <SumRow label="Tile Type" value={iLabel} />
                      <SumRow label="Tiled Surface Area" value={`${totalTiledArea.toFixed(1)} Sq.m`} />
                      <SumRow label="Tile Qty (incl. 8% waste)" value={`${tileAreaWithWaste.toFixed(1)} Sq.m`} />
                      <SumRow label="Tile Supply P.C. Rate" value={"$" + tilePCRateVal.toFixed(2) + "/Sq.m" + (tilePCSurchargeS > 0 ? " — +$" + tilePCSurchargeS.toLocaleString("en-AU") + " added to pool price" : " (base rate - included)")} />
                      {form.interior === "ceramic25mm" && <SumRow label="25mm Surcharge" value={`${totalTiledArea.toFixed(1)} Sq.m × $35 = $${Math.round(totalTiledArea * 35).toLocaleString("en-AU")}`} />}
                      {form.interior === "aquaneon" && <SumRow label="AquaNeon Discount" value={`${sqm.toFixed(1)} Sq.m × $145 = −$${Math.round(sqm * 145).toLocaleString("en-AU")}`} credit />}
                    </>;
                  })()}
                  {form.hasMembrane && <SumRow label="Waterproof Membrane" value={`${perimSqm.toFixed(1)} Sq.m × $90 = $${Math.round(perimSqm * 90).toLocaleString("en-AU")}`} />}
                </SumSection>

                {(form.externalSurfacesSqm || form.externalSurfacesCost) && <SumSection title="External Surfaces">

                  {form.externalSurfacesType && <SumRow label="Type of Finish" value={form.externalSurfacesType} />}
                  {externalSurfacesCostS > 0 && <SumRow label="Cost (incl. in pool price)" value={"$" + externalSurfacesCostS.toLocaleString("en-AU")} />}

                  {form.heatPump !== "None" && form.heatPumpWallMount && parseFloat(form.heatPumpWallMountCost) > 0 && <SumRow label="Wall Mounting" value={`$${parseFloat(form.heatPumpWallMountCost).toLocaleString("en-AU")} (incl. in Heat Pump total)`} />}
                </SumSection>

                {(() => {
                  // Implied gross margin analysis
                  // Pool base cost = pool sell price / (1 + baseMargin) / (1 + marginUpliftPct)
                  const poolSellPrice = poolBase;
                  const poolEstCost = Math.round(poolSellPrice / totalMarginMultiplier);
                  // All other confirmed PP items — assume 15% margin baked in
                  const otherSell = exGSTTotal - poolSellPrice;
                  const otherEstCost = Math.round(otherSell / 1.15);
                  const totalEstCost = poolEstCost + otherEstCost;
                  const impliedMarginDollar = exGSTTotal - totalEstCost;
                  const impliedMarginPct = exGSTTotal > 0 ? ((impliedMarginDollar / exGSTTotal) * 100).toFixed(1) : 0;

                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 12 }}>

                      </div>
                    </div>

                })()}
              </div>
            );
          })()}
        </div>
      )}

      {view === "proposal" && result && (
        <div style={cardStyle}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
            <div style={{ fontSize: 17, fontWeight: 800, color: "#0d2d6b" }}>Quotation — Ready to Send</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={btnSecondary} onClick={() => setView("estimator")}>← Edit</button>
              <button style={btnPrimary} onClick={() => setView("result")}>View Summary →</button>
            </div>
          </div>
          <ProposalOutput />
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<EnkipoolsEstimator />);
  </script>
</body>
</html>
